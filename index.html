<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SpendWise</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>💰 SpendWise</h1>
    <p>Track your spending. Stay in budget.</p>
  </header>

  <main>
    <section class="card" id="budget-section">
      <h2>Monthly Budget</h2>
      <form id="budget-form">
        <input type="number" id="budget-input" placeholder="Enter budget (KES)" min="1" step="any">
        <button type="submit">Set Budget</button>
      </form>
    </section>

    <section class="card" id="dashboard">
      <h2>Dashboard</h2>
      <div class="stats">
        <div><span>Budget</span><strong id="budget-display">KES 0.00</strong></div>
        <div><span>Spent</span><strong id="spent-display">KES 0.00</strong></div>
        <div><span>Remaining</span><strong id="remaining-display">KES 0.00</strong></div>
      </div>
      <div class="bar"><div id="progress-bar"></div></div>
      <p id="status-message" class="status">Set a budget to get started.</p>
    </section>

    <section class="card">
      <h2>Add Expense</h2>
      <form id="expense-form">
        <input type="text" id="name-input" placeholder="Expense name (e.g. Lunch)">
        <input type="number" id="amount-input" placeholder="Amount (KES)" min="0.01" step="any">
        <select id="category-input">
          <option value="Food">Food</option>
          <option value="Transport">Transport</option>
          <option value="Bills">Bills</option>
          <option value="Fun">Fun</option>
          <option value="Other">Other</option>
        </select>
        <button type="submit">Add Expense</button>
      </form>
      <p id="error-message" class="error"></p>
    </section>

    <section class="card">
      <div class="list-header">
        <h2>Expenses</h2>
        <button id="clear-btn" class="danger">Clear All</button>
      </div>
      <ul id="expense-list"></ul>
      <h3>By Category</h3>
      <ul id="category-summary"></ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
